[package]
name = "kim-agent-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local Goose agent host for KIM desktop IM (@agent)"

[features]
# Desktop `rust_agent` enables this. Off by default so the phone FFI does not
# link the Codex agent. SQLite itself is shared with the root workspace.
codex = [
    "dep:codex-config",
    "dep:codex-core",
    "dep:codex-core-api",
    "dep:codex-protocol",
    "dep:codex-utils-redacted-string",
    "dep:rama-error",
    "dep:rama-macros",
    "dep:rama-utils",
    "dep:toml",
]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
codex-config = { path = "../../third_party/codex/codex-rs/config", optional = true }
codex-core = { path = "../../third_party/codex/codex-rs/core", optional = true }
codex-core-api = { path = "../../third_party/codex/codex-rs/core-api", optional = true }
# Facade does not re-export ReviewDecision, ReasoningEffort, or RedactedString.
codex-protocol = { path = "../../third_party/codex/codex-rs/protocol", optional = true }
codex-utils-redacted-string = { path = "../../third_party/codex/codex-rs/utils/redacted-string", optional = true }
# `cargo update` otherwise selects rama 0.3.0, which needs rustc 1.96.
# Codex lock pins 0.3.0-alpha.4, which builds on 1.95.
rama-error = { version = "=0.3.0-alpha.4", optional = true }
rama-macros = { version = "=0.3.0-alpha.4", optional = true }
rama-utils = { version = "=0.3.0-alpha.4", optional = true }
toml = { version = "0.9.5", optional = true }
futures.workspace = true
goose-agent = "0.1.0-alpha.9"
goose-provider-types = { version = "0.1.0-alpha.9", default-features = false }
goose-providers = { version = "0.1.0-alpha.9", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-child-process"] }
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
