[package]
name = "kim-agent-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local Goose agent host for KIM desktop IM (@agent)"

[dependencies]
anyhow = "1"
async-trait.workspace = true
futures.workspace = true
goose-agent = "0.1.0-alpha.9"
goose-provider-types = { version = "0.1.0-alpha.9", default-features = false }
goose-providers = { version = "0.1.0-alpha.9", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "3.2", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
