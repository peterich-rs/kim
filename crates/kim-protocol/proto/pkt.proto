syntax = "proto3";
package kim.pkt;

enum Flag {
  Request = 0;
  Response = 1;
  Push = 2;
}

enum Status {
  Success = 0;
  InvalidPacket = 1;
  CommandNotFound = 2;
  ServiceUnavailable = 3;
  SystemException = 99;

  InvalidPacketBody = 101;
  InvalidCommand = 103;
  Unauthorized = 105;
  ContentBlocked = 106;  // talk filter rejected the payload
  NotGroupMember = 107;  // group talk sender is not a member
  UserNotFound = 108;    // talk dest is not a registered account
  NotFriends = 109;      // 1:1 talk without an accepted friendship
  Blocked = 110;         // blocked either direction
  IdempotencyConflict = 111; // same clientId, different dest/type/body/extra/kind
  NoDestination = 300;   // Header.dest empty
  SessionNotFound = 404;
}

message Meta {
  string key = 1;
  string value = 2;
}

message Header {
  string command = 1;
  string channelId = 2;
  uint32 sequence = 3;
  Flag flag = 4;
  Status status = 5;
  string dest = 6;
  uint32 bodyLength = 7;
  repeated Meta meta = 8;
}

message InnerHandshakeReq {
  string serviceId = 1;
}

message LoginReq {
  string token = 1;
  string device = 2; // "web"/"desktop"/"cli" = multi; "mobile"/"ios"/"android" = one
}

message LoginResp {
  string channelId = 1;
}

message Session {
  string channelId = 1;
  string gateId = 2;
  string account = 3;
  string zone = 4;
  string isp = 5;
  string remoteIP = 6;
  string device = 7;
  string app = 8;
  repeated string tags = 9;
}

message KickoutNotify {
  string channelId = 1;
}

message MessageReq {
  int32 type = 1;
  string body = 2;
  string extra = 3;
  string clientId = 4; // empty = no idempotency
}

message MessageResp {
  int64 messageId = 1;
  int64 sendTime = 2;
}

message MessagePush {
  int64 messageId = 1;
  int32 type = 2;
  string body = 3;
  string extra = 4;
  string sender = 5;
  int64 sendTime = 6;
}

message GroupCreateReq {
  string name = 1;
  string avatar = 2;
  string introduction = 3;
  string owner = 4;
  repeated string members = 5;
}

message GroupCreateResp {
  string groupId = 1;
}

message MessageAckReq {
  int64 messageId = 1;
}

message MessageIndex {
  int64 messageId = 1;
  int32 direction = 2;
  int64 sendTime = 3;
  string accountB = 4;
  string group = 5;
}

message Message {
  int64 messageId = 1;
  int32 type = 2;
  string body = 3;
  string extra = 4;
}

message MessageIndexReq {
  int64 messageId = 1;
}

message MessageIndexResp {
  repeated MessageIndex indexes = 1;
}

message MessageContentReq {
  repeated int64 messageIds = 1;
  string account = 2; // Chat→Royal; clients leave empty, handler overwrites
  string app = 3;
}

message MessageContentResp {
  repeated Message messages = 1;
}

message GroupJoinReq {
  string account = 1;
  string groupId = 2;
}

message GroupQuitReq {
  string account = 1;
  string groupId = 2;
}

message GroupQueryReq {
  string groupId = 1;
}

message GroupMembersResp {
  repeated string members = 1;
}

message GroupDetail {
  string groupId = 1;
  string name = 2;
  string avatar = 3;
  string introduction = 4;
  string owner = 5;
  repeated string members = 6;
}

message GroupCreateNotify {
  string groupId = 1;
  repeated string members = 2;
}

// Royal HTTP bodies. Long-connection dest still carries group id / account.
message InsertMessageReq {
  string sender = 1;
  string dest = 2;
  int64 sendTime = 3;
  MessageReq message = 4;
  repeated string members = 5;
  string clientId = 6;
}

message InsertFanout {
  int32 type = 1;                 // MessageReq.type / MessagePush.type
  string body = 2;
  string extra = 3;
  string sender = 4;
  string dest = 5;                // 1:1 peer account; group id
  int32 kind = 6;                 // 0 user, 1 group (same as InboxItem.kind)
  repeated string recipients = 7;
}

message InsertMessageResp {
  int64 messageId = 1;
  int64 sendTime = 2;
  bool duplicate = 3;
  InsertFanout fanout = 4;        // proto3 optional message → prost Option
}

message AckMessageReq {
  string account = 1;
  int64 messageId = 2;
}

message OfflineIndexReq {
  string account = 1;
  int64 messageId = 2;
}

message AuthReq {
  string account = 1;
  string password = 2;
}

message AuthResp {
  string token = 1;
  int64 exp = 2;
  string account = 3;
}

// Chat ↔ Royal / Royal ↔ Chat. Not on the public Caddy /api/v1/auth surface.
message AccountQuery {
  string account = 1;
}

message AccountExists {
  bool exists = 1;
}

message KickAccount {
  string account = 1;
  string app = 2;
}

message RevokeQuery {
  string jti = 1;
}

message RevokeStatus {
  bool revoked = 1;
}

message UserProfile {
  string account = 1;
  string nickname = 2;
  string avatar = 3;
  string bio = 4;
}

message UserProfileUpdate {
  string nickname = 1;
  string avatar = 2;
  string bio = 3;
}

message UserSearchReq {
  string query = 1;
}

message UserSearchResp {
  repeated UserProfile users = 1;
}

message UserListResp {
  repeated UserProfile users = 1;
}

message PasswordChangeReq {
  string oldPassword = 1;
  string newPassword = 2;
}

message AccountPair {
  string account = 1;
  string peer = 2;
}

message FriendRequestNotify {
  string fromAccount = 1;
  string fromNickname = 2;
}

message InboxReq {
  int32 limit = 1;
}

message InboxItem {
  string dest = 1;
  int32 kind = 2; // 0 user, 1 group
  string title = 3;
  string avatar = 4;
  string lastBody = 5;
  string lastSender = 6;
  int64 lastMessageId = 7;
  int64 lastSendTime = 8;
  int32 unread = 9;
}

message InboxResp {
  repeated InboxItem items = 1;
}

message HistoryReq {
  int64 beforeId = 1; // 0 = latest page
  int32 limit = 2;
  int32 kind = 3; // 0 user, 1 group
}

message HistoryItem {
  int64 messageId = 1;
  int32 type = 2;
  string body = 3;
  string extra = 4;
  string sender = 5;
  int64 sendTime = 6;
  int32 direction = 7;
}

message HistoryResp {
  repeated HistoryItem messages = 1;
}

message ConversationReadReq {
  int64 messageId = 1;
  int32 kind = 2; // 0 user, 1 group
}

// Royal HTTP bodies. Long-connection dest still carries account / group id.
message InboxQuery {
  string account = 1;
  int32 limit = 2;
}

message HistoryQuery {
  string account = 1;
  string dest = 2;
  int32 kind = 3;
  int64 beforeId = 4;
  int32 limit = 5;
}

message ConversationRead {
  string account = 1;
  string dest = 2;
  int32 kind = 3;
  int64 messageId = 4;
}

message AccountList {
  repeated string accounts = 1;
}

message ProfileUpdateReq {
  string account = 1;
  string nickname = 2;
  string avatar = 3;
  string bio = 4;
}

message UserSearchQuery {
  string query = 1;
  repeated string exclude = 2;
  int32 limit = 3;
}

// Chat→Royal only. Client group commands still use GroupCreateReq /
// GroupQueryReq / GroupJoinReq / GroupQuitReq.
message InternalGroupCreate {
  string app = 1;
  string name = 2;
  string avatar = 3;
  string introduction = 4;
  string owner = 5;
  repeated string members = 6;
}
message InternalGroupQuery {
  string app = 1;
  string groupId = 2;
}
message InternalGroupMember {
  string app = 1;
  string groupId = 2;
  string account = 3;
}
