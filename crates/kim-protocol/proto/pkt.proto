syntax = "proto3";
package kim.pkt;

enum Flag {
  Request = 0;
  Response = 1;
  Push = 2;
}

enum Status {
  Success = 0;
  InvalidPacket = 1;
  CommandNotFound = 2;
  ServiceUnavailable = 3;
  SystemException = 99;

  InvalidPacketBody = 101;
  InvalidCommand = 103;
  Unauthorized = 105;
  ContentBlocked = 106;  // talk filter rejected the payload
  NotGroupMember = 107;  // group talk sender is not a member
  NoDestination = 300;   // Header.dest empty
  SessionNotFound = 404;
}

message Meta {
  string key = 1;
  string value = 2;
}

message Header {
  string command = 1;
  string channelId = 2;
  uint32 sequence = 3;
  Flag flag = 4;
  Status status = 5;
  string dest = 6;
  uint32 bodyLength = 7;
  repeated Meta meta = 8;
}

message InnerHandshakeReq {
  string serviceId = 1;
}

message LoginReq {
  string token = 1;
}

message LoginResp {
  string channelId = 1;
}

message Session {
  string channelId = 1;
  string gateId = 2;
  string account = 3;
  string zone = 4;
  string isp = 5;
  string remoteIP = 6;
  string device = 7;
  string app = 8;
  repeated string tags = 9;
}

message KickoutNotify {
  string channelId = 1;
}

message MessageReq {
  int32 type = 1;
  string body = 2;
  string extra = 3;
}

message MessageResp {
  int64 messageId = 1;
  int64 sendTime = 2;
}

message MessagePush {
  int64 messageId = 1;
  int32 type = 2;
  string body = 3;
  string extra = 4;
  string sender = 5;
  int64 sendTime = 6;
}

message GroupCreateReq {
  string name = 1;
  string avatar = 2;
  string introduction = 3;
  string owner = 4;
  repeated string members = 5;
}

message GroupCreateResp {
  string groupId = 1;
}

message MessageAckReq {
  int64 messageId = 1;
}

message MessageIndex {
  int64 messageId = 1;
  int32 direction = 2;
  int64 sendTime = 3;
  string accountB = 4;
  string group = 5;
}

message Message {
  int64 messageId = 1;
  int32 type = 2;
  string body = 3;
  string extra = 4;
}

message MessageIndexReq {
  int64 messageId = 1;
}

message MessageIndexResp {
  repeated MessageIndex indexes = 1;
}

message MessageContentReq {
  repeated int64 messageIds = 1;
}

message MessageContentResp {
  repeated Message messages = 1;
}

message GroupJoinReq {
  string account = 1;
  string groupId = 2;
}

message GroupQuitReq {
  string account = 1;
  string groupId = 2;
}

message GroupQueryReq {
  string groupId = 1;
}

message GroupMembersResp {
  repeated string members = 1;
}

message GroupDetail {
  string groupId = 1;
  string name = 2;
  string avatar = 3;
  string introduction = 4;
  string owner = 5;
  repeated string members = 6;
}

message GroupCreateNotify {
  string groupId = 1;
  repeated string members = 2;
}

// Royal HTTP bodies. Long-connection dest still carries group id / account.
message InsertMessageReq {
  string sender = 1;
  string dest = 2;
  int64 sendTime = 3;
  MessageReq message = 4;
  repeated string members = 5;
}

message InsertMessageResp {
  int64 messageId = 1;
}

message AckMessageReq {
  string account = 1;
  int64 messageId = 2;
}

message OfflineIndexReq {
  string account = 1;
  int64 messageId = 2;
}

message AuthReq {
  string account = 1;
  string password = 2;
}

message AuthResp {
  string token = 1;
  int64 exp = 2;
  string account = 3;
}
