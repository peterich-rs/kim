syntax = "proto3";
package kim.pkt;

enum Flag {
  Request = 0;
  Response = 1;
  Push = 2;
}

enum Status {
  Success = 0;
  InvalidPacket = 1;
  CommandNotFound = 2;
  ServiceUnavailable = 3;
  SystemException = 99;

  InvalidPacketBody = 101;
  InvalidCommand = 103;
  Unauthorized = 105;
  ContentBlocked = 106;  // talk filter rejected the payload
  NotGroupMember = 107;  // group talk sender is not a member
  UserNotFound = 108;    // talk dest is not a registered account
  NotFriends = 109;      // 1:1 talk without an accepted friendship
  Blocked = 110;         // blocked either direction
  IdempotencyConflict = 111; // same clientId, different dest/type/body/extra/kind
  NoDestination = 300;   // Header.dest empty
  SessionNotFound = 404;
}

message Meta {
  string key = 1;
  string value = 2;
}

message Header {
  string command = 1;
  string channelId = 2;
  uint32 sequence = 3;
  Flag flag = 4;
  Status status = 5;
  string dest = 6;
  uint32 bodyLength = 7;
  repeated Meta meta = 8;
}

message InnerHandshakeReq {
  string serviceId = 1;
}

message LoginReq {
  string token = 1;
  string device = 2; // "web"/"desktop"/"cli" = multi; "mobile"/"ios"/"android" = one
  string deviceCredential = 3; // empty = today's path
}

message LoginResp {
  string channelId = 1;
}

message Session {
  string channelId = 1;
  string gateId = 2;
  string account = 3;
  string zone = 4;
  string isp = 5;
  string remoteIP = 6;
  string device = 7;
  string app = 8;
  repeated string tags = 9;
  string jti = 10; // P0 delivery target; empty = no receipts for this session
  string deviceId = 11; // optional; unused by pending_delivery.target_id
}

message KickoutNotify {
  string channelId = 1;
}

message MessageReq {
  int32 type = 1;
  string body = 2;
  string extra = 3;
  string clientId = 4; // empty = no idempotency
}

message MessageResp {
  int64 messageId = 1;
  int64 sendTime = 2;
}

message MessagePush {
  int64 messageId = 1;
  int32 type = 2;
  string body = 3;
  string extra = 4;
  string sender = 5;
  int64 sendTime = 6;
}

message GroupCreateReq {
  string name = 1;
  string avatar = 2;
  string introduction = 3;
  string owner = 4;
  repeated string members = 5;
}

message GroupCreateResp {
  string groupId = 1;
}

message MessageAckReq {
  int64 messageId = 1;            // 旧客户端：单条
  repeated int64 messageIds = 2;  // 新客户端：批量
}

message MessageIndex {
  int64 messageId = 1;
  int32 direction = 2;
  int64 sendTime = 3;
  string accountB = 4;
  string group = 5;
}

message Message {
  int64 messageId = 1;
  int32 type = 2;
  string body = 3;
  string extra = 4;
}

message MessageIndexReq {
  int64 messageId = 1; // 不再当高水位
  bool resume = 2;     // 新客户端 true；省略/false = 遗留回路
}

message MessageIndexResp {
  repeated MessageIndex indexes = 1;
  bool hasMore = 2;
}

message MessageContentReq {
  repeated int64 messageIds = 1;
  string account = 2; // Chat→Royal; clients leave empty, handler overwrites
  string app = 3;
}

message MessageContentResp {
  repeated Message messages = 1;
}

message GroupJoinReq {
  string account = 1;
  string groupId = 2;
}

message GroupQuitReq {
  string account = 1;
  string groupId = 2;
}

message GroupQueryReq {
  string groupId = 1;
}

message GroupMembersResp {
  repeated string members = 1;
}

message GroupDetail {
  string groupId = 1;
  string name = 2;
  string avatar = 3;
  string introduction = 4;
  string owner = 5;
  repeated string members = 6;
}

message GroupCreateNotify {
  string groupId = 1;
  repeated string members = 2;
}

// Royal HTTP bodies. Long-connection dest still carries group id / account.
message DeliveryTarget {
  string account = 1;
  string targetId = 2; // jti
}

message InsertMessageReq {
  string sender = 1;
  string dest = 2;
  int64 sendTime = 3;
  MessageReq message = 4;
  repeated string members = 5;
  string clientId = 6;
  repeated DeliveryTarget onlineTargets = 7;
}

message InsertFanout {
  int32 type = 1;                 // MessageReq.type / MessagePush.type
  string body = 2;
  string extra = 3;
  string sender = 4;
  string dest = 5;                // 1:1 peer account; group id
  int32 kind = 6;                 // 0 user, 1 group (same as InboxItem.kind)
  repeated string recipients = 7;
}

message InsertMessageResp {
  int64 messageId = 1;
  int64 sendTime = 2;
  bool duplicate = 3;
  InsertFanout fanout = 4;        // proto3 optional message → prost Option
}

message AckMessageReq {
  string account = 1;
  int64 messageId = 2;
  repeated int64 messageIds = 3;
  string targetId = 4;
  string app = 5;
}

message OfflineIndexReq {
  string account = 1;
  int64 messageId = 2;
  string targetId = 3;
  string app = 4;
  bool resume = 5;
}

message DeliveryBackfillReq {
  string app = 1;
  string account = 2;
  string targetId = 3;
}

message AuthReq {
  string account = 1;
  string password = 2; // plaintext; only when server allows (tests/legacy)
  string deviceCredential = 3; // present to bind an issued credential
  bool enrollDevice = 4;       // old clients default false
  bytes passwordSealed = 5;    // X25519 sealed box ciphertext
  string keyId = 6;            // matches GET /api/v1/auth/password-key
}

message AuthResp {
  string token = 1;
  int64 exp = 2;
  string account = 3;
  string deviceId = 4;
  string deviceCredential = 5; // issued once on enroll
}

// Chat ↔ Royal / Royal ↔ Chat. Not on the public Caddy /api/v1/auth surface.
message AccountQuery {
  string account = 1;
}

message AccountExists {
  bool exists = 1;
}

message KickAccount {
  string account = 1;
  string app = 2;
}

message RevokeQuery {
  string jti = 1;
}

message RevokeStatus {
  bool revoked = 1;
}

message TokenEpochQuery {
  string account = 1;
}

message TokenEpoch {
  uint32 epoch = 1;
}

message DeviceCheckQuery {
  string account = 1;
  string deviceId = 2;
  string deviceCredential = 3;
}

message DeviceCheckStatus {
  bool ok = 1;
}

message UserProfile {
  string account = 1;
  string nickname = 2;
  string avatar = 3;
  string bio = 4;
  int32 kind = 5; // 1 human, 2 bot (0 on the wire = absent, treat as human)
}

message UserProfileUpdate {
  string nickname = 1;
  string avatar = 2;
  string bio = 3;
}

message UserSearchReq {
  string query = 1;
}

message UserSearchResp {
  repeated UserProfile users = 1;
}

message UserListResp {
  repeated UserProfile users = 1;
}

message PasswordChangeReq {
  string oldPassword = 1;
  string newPassword = 2;
  bytes oldPasswordSealed = 3;
  bytes newPasswordSealed = 4;
  string keyId = 5;
}

// Public password-envelope key for clients (X25519 sealed box).
message PasswordKeyResp {
  string keyId = 1;
  string alg = 2;          // "x25519-seal"
  string publicKeyB64 = 3; // 32-byte X25519 public key, standard base64
}

message AccountPair {
  string account = 1;
  string peer = 2;
}

enum PresenceStatus {
  PRESENCE_UNSPECIFIED = 0;
  PRESENCE_OFFLINE = 1;
  PRESENCE_ONLINE = 2;
  PRESENCE_BUSY = 3; // reserved; v1 does not emit
}

message Presence {
  string account = 1;
  PresenceStatus status = 2;
  int64 last_seen = 3; // unix ms; optional on OFFLINE
}

message RoomEnterReq {
  string dest = 1; // peer account (DM) or group id
  int32 kind = 2;  // 0 = user, 1 = group (inbox kind)
}

message RoomEnterResp {
  repeated Presence presence = 1;
}

message RoomLeaveReq {
  string dest = 1;
  int32 kind = 2;
}

message PresencePush {
  repeated Presence entries = 1;
}

// Conversation-scoped typing (DM v1). Ephemeral; no DB.
message TypingReq {
  string dest = 1; // peer account
  int32 kind = 2;  // 0 = user only for v1
  bool active = 3; // true while composing; false = stop
}

message TypingPush {
  string typer = 1;
  string dest = 2;
  int32 kind = 3;
  bool active = 4;
}

// DM read receipt push body (reuse ConversationRead shape on wire via fields).
// Push command: chat.receipt.read
message ReadReceiptPush {
  string reader = 1;
  string dest = 2;
  int32 kind = 3;
  int64 message_id = 4;
}

message FriendRequestNotify {
  string fromAccount = 1;
  string fromNickname = 2;
}

message InboxReq {
  int32 limit = 1;
}

message InboxItem {
  string dest = 1;
  int32 kind = 2; // 0 user, 1 group
  string title = 3;
  string avatar = 4;
  string lastBody = 5;
  string lastSender = 6;
  int64 lastMessageId = 7;
  int64 lastSendTime = 8;
  int32 unread = 9;
}

message InboxResp {
  repeated InboxItem items = 1;
}

message HistoryReq {
  int64 beforeId = 1; // 0 = latest page
  int32 limit = 2;
  int32 kind = 3; // 0 user, 1 group
}

message HistoryItem {
  int64 messageId = 1;
  int32 type = 2;
  string body = 3;
  string extra = 4;
  string sender = 5;
  int64 sendTime = 6;
  int32 direction = 7;
}

message HistoryResp {
  repeated HistoryItem messages = 1;
}

message ConversationReadReq {
  int64 messageId = 1;
  int32 kind = 2; // 0 user, 1 group
}

// Royal HTTP bodies. Long-connection dest still carries account / group id.
message InboxQuery {
  string account = 1;
  int32 limit = 2;
}

message HistoryQuery {
  string account = 1;
  string dest = 2;
  int32 kind = 3;
  int64 beforeId = 4;
  int32 limit = 5;
}

message ConversationRead {
  string account = 1;
  string dest = 2;
  int32 kind = 3;
  int64 messageId = 4;
}

message AccountList {
  repeated string accounts = 1;
}

message ProfileUpdateReq {
  string account = 1;
  string nickname = 2;
  string avatar = 3;
  string bio = 4;
}

message UserSearchQuery {
  string query = 1;
  repeated string exclude = 2;
  int32 limit = 3;
}

// Chat→Royal only. Client group commands still use GroupCreateReq /
// GroupQueryReq / GroupJoinReq / GroupQuitReq.
message InternalGroupCreate {
  string app = 1;
  string name = 2;
  string avatar = 3;
  string introduction = 4;
  string owner = 5;
  repeated string members = 6;
}
message InternalGroupQuery {
  string app = 1;
  string groupId = 2;
}

// Chat→Royal only. Inbox batch lookup; no members payload.
message GroupSummary {
  string groupId = 1;
  string name = 2;
  string avatar = 3;
}
message GroupListReq {
  string app = 1;
  repeated string groupIds = 2;
}
message GroupListResp {
  repeated GroupSummary groups = 1;
}
message InternalGroupMember {
  string app = 1;
  string groupId = 2;
  string account = 3;
}
