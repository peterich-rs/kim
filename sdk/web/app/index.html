<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KIM</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="auth" class="auth">
      <aside class="auth-brand">
        <p class="eyebrow">KIM</p>
        <h1>给朋友用的实时聊天</h1>
        <p class="lede">注册一个账号，开两个窗口就能互发。长连接走网关，短接口走登录。</p>
      </aside>
      <section class="auth-card">
        <div class="tabs" role="tablist">
          <button type="button" class="tab on" id="tab-login" data-mode="login">登录</button>
          <button type="button" class="tab" id="tab-register" data-mode="register">注册</button>
        </div>
        <form id="auth-form" autocomplete="on">
          <label>
            账号
            <input id="auth-account" name="username" autocomplete="username" spellcheck="false" maxlength="32" />
          </label>
          <label>
            密码
            <span class="pw-row">
              <input id="auth-password" name="password" type="password" autocomplete="current-password" />
              <button type="button" class="ghost tiny" id="toggle-pw">显示</button>
            </span>
          </label>
          <label id="confirm-wrap" class="hidden">
            确认密码
            <input id="auth-confirm" type="password" autocomplete="new-password" />
          </label>
          <p class="form-error" id="auth-error" hidden></p>
          <button type="submit" id="auth-submit">登录</button>
        </form>
      </section>
    </div>

    <div id="shell" class="shell hidden">
      <nav class="rail" aria-label="空间">
        <button type="button" class="pill on" id="home-pill" title="私信">私</button>
        <div class="rail-groups" id="rail-groups"></div>
        <button type="button" class="pill add" id="new-group" title="建群">+</button>
      </nav>

      <aside class="sidebar">
        <header class="side-top">
          <h2 id="side-title">私信</h2>
          <form id="new-dm" class="new-dm">
            <input id="new-dm-acc" placeholder="对方账号" spellcheck="false" autocomplete="off" />
            <button type="submit">开聊</button>
          </form>
        </header>
        <ul class="threads" id="threads"></ul>
        <footer class="me">
          <span class="avatar" id="me-avatar">?</span>
          <div>
            <strong id="me-name">—</strong>
            <p id="me-status">未连接</p>
          </div>
          <button type="button" class="ghost" id="logout">退出</button>
        </footer>
      </aside>

      <main class="stage">
        <header class="chat-top">
          <button type="button" class="ghost back" id="back">返回</button>
          <div>
            <h2 id="chat-title">选择一个对话</h2>
            <p id="chat-sub">登录后从左侧开始</p>
          </div>
          <button type="button" class="ghost members-toggle" id="members-toggle">成员</button>
        </header>
        <ol class="log" id="log"></ol>
        <p class="empty" id="empty">还没有消息。在左侧开一个私信，或建一个群。</p>
        <form class="composer" id="composer">
          <input id="body" placeholder="发一条消息" autocomplete="off" />
          <button type="submit" id="send" disabled>发送</button>
        </form>
      </main>

      <aside class="members" id="members-panel" hidden>
        <h3>成员</h3>
        <ul id="members"></ul>
      </aside>
    </div>

    <div class="modal hidden" id="group-modal">
      <form class="modal-card" id="group-form">
        <h3>新建群</h3>
        <label>
          群名
          <input id="group-name" placeholder="周末局" spellcheck="false" />
        </label>
        <label>
          成员账号，逗号分隔
          <input id="group-members" placeholder="bob,carol" spellcheck="false" />
        </label>
        <p class="form-error" id="group-error" hidden></p>
        <div class="modal-actions">
          <button type="button" class="ghost" id="group-cancel">取消</button>
          <button type="submit">创建</button>
        </div>
      </form>
    </div>

    <div class="banner hidden" id="banner"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
