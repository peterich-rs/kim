[workspace]

[package]
name = "kim_client_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
kim-agent-codec = { path = "../../../crates/kim-agent-codec" }
kim-client = { path = "../../../crates/kim-client" }
kim-sdk = { path = "../../../crates/kim-sdk" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Keep DWARF in the cdylib. Flutter copies the dylib into a framework and
# does not copy a sidecar .dSYM, so unpacked/packed split-debuginfo is
# invisible to lldb when attaching to the running app.
[profile.dev]
split-debuginfo = "off"
