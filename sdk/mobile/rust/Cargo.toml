[workspace]

[package]
name = "kim_client_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
kim-client = { path = "../../../crates/kim-client" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
