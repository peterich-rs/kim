name: kim_media_picker
description: Native WeChat-style camera (CameraX / AVFoundation) and album picker.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kim.kim_media_picker
        pluginClass: KimMediaPickerPlugin
      ios:
        pluginClass: KimMediaPickerPlugin
