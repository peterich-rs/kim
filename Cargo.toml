[workspace]
resolver = "2"
members = [
    "crates/kim-core",
    "crates/kim-tcp",
    "crates/kim-ws",
    "crates/kim-protocol",
    "crates/kim-naming",
    "crates/kim-container",
    "crates/kim-router",
    "crates/kim-session",
    "examples/fake-gateway",
    "examples/fake-chat",
    "examples/fake-royal",
    "examples/pkt-client",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.95.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }

[workspace.dependencies]
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
prost = "0.13"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
crc32fast = "1"
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
kim-core = { path = "crates/kim-core" }
kim-tcp = { path = "crates/kim-tcp" }
kim-ws = { path = "crates/kim-ws" }
kim-protocol = { path = "crates/kim-protocol" }
kim-naming = { path = "crates/kim-naming" }
kim-container = { path = "crates/kim-container" }
kim-router = { path = "crates/kim-router" }
kim-session = { path = "crates/kim-session" }
snowflake_me = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
