[workspace]
resolver = "2"
exclude = ["third_party"]
members = [
    "crates/kim-core",
    "crates/kim-tcp",
    "crates/kim-ws",
    "crates/kim-protocol",
    "crates/kim-naming",
    "crates/kim-container",
    "crates/kim-router",
    "crates/kim-session",
    "crates/kim-metrics",
    "crates/kim-client",
    "crates/kim-sdk",
    "crates/kim-agent-host",
    "crates/kim-codex-helper",
    "crates/kim-agent-codec",
    "crates/kim-log",
    "crates/kim-desktop-runtime",
    "crates/kim-client-ffi",
    "crates/kim-agent-ffi",
    "services/gateway",
    "services/chat",
    "services/royal",
    "services/tgateway",
    "services/router",
    "examples/pkt-client",
    "examples/kim-client-demo",
    "examples/kimbench",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.95.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
unwrap_used = { level = "warn", priority = 1 }

[workspace.dependencies]
anyhow = "1"
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
prost = "0.14"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
crc32fast = "1"
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
kim-core = { path = "crates/kim-core" }
kim-tcp = { path = "crates/kim-tcp" }
kim-ws = { path = "crates/kim-ws" }
kim-protocol = { path = "crates/kim-protocol" }
kim-naming = { path = "crates/kim-naming" }
kim-container = { path = "crates/kim-container" }
kim-router = { path = "crates/kim-router" }
kim-session = { path = "crates/kim-session" }
kim-sdk = { path = "crates/kim-sdk" }
snowflake_me = "2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite-bundled", "macros", "migrate"] }
# Same crate Codex rust-v0.155.1 locks. sqlx 0.9 accepts this; 0.8 cannot.
libsqlite3-sys = { version = "=0.37.0", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde_json = "1"
# Maintained serde_yaml 0.9 fork (upstream crate is archived).
serde_norway = "0.9"
clap = { version = "4", features = ["derive"] }
humantime = "2"
prometheus = { version = "0.14", default-features = false }
kim-metrics = { path = "crates/kim-metrics" }
kim-client = { path = "crates/kim-client" }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
hmac = "0.12"
sha2 = "0.10"
url = "2"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
dashmap = "6"
arc-swap = "1"
moka = { version = "0.12", features = ["sync"] }
kim-agent-codec = { path = "crates/kim-agent-codec" }
kim-agent-host = { path = "crates/kim-agent-host" }
kim-desktop-runtime = { path = "crates/kim-desktop-runtime" }
kim-log = { path = "crates/kim-log" }
flutter_rust_bridge = "=2.13.0"

# Codex pin rust-v0.155.1 patches crates.io copies that lack the `proxy`
# feature. Path deps do not inherit the Codex workspace [patch] table.
#
# macOS `split-debuginfo = "off"` does not embed DWARF in a cdylib. rustc
# skips dsymutil and deletes the `.rcgu.o` files the debug map still names,
# so lldb cannot bind breakpoints after Flutter copies the library into the
# app framework. `unpacked` keeps those objects; lldb follows the absolute
# paths. `packed` writes a `.dSYM` beside the cargo output, which the
# framework copy does not include. This stays on the two FFI packages so a
# root profile change cannot drop their object files.
[profile.dev.package.kim_client_ffi]
split-debuginfo = "unpacked"

[profile.dev.package.kim_agent_ffi]
split-debuginfo = "unpacked"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
