name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protobuf-src build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 2026-08-05
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --workspace --all-features

  postgres:
    name: postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kim
          POSTGRES_PASSWORD: kim
          POSTGRES_DB: kim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kim -d kim"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://kim:kim@127.0.0.1:5432/kim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protobuf-src build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ make postgresql-client

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 2026-08-05
        with:
          toolchain: 1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: chat postgres tests
        run: cargo test -p chat --features postgres,redis --all-targets

      - name: backfill and tuple diff (empty and after tests)
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -f deploy/backfill-inbox.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -f deploy/backfill-inbox.sql
          leftover=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -tA -f deploy/diff-inbox.sql)
          if [[ -n "${leftover}" ]]; then
            echo "diff-inbox.sql was not empty:" >&2
            printf '%s\n' "$leftover" >&2
            exit 1
          fi

  sdk-web:
    name: web sdk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protobuf-src build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 2026-08-05
        with:
          toolchain: 1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build gateway binaries
        run: cargo build -p chat -p gateway

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/web/package-lock.json

      - name: Install and unit test
        working-directory: sdk/web
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: E2E
        working-directory: sdk/web
        run: npm run test:e2e

  sdk-mobile:
    name: mobile sdk
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml lists every app target; CI only needs the host.
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protobuf-src build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 2026-08-05
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sdk/mobile/rust -> sdk/mobile/rust/target

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: sdk/mobile/.fvmrc
          cache: true

      - name: Pub get
        working-directory: sdk/mobile
        run: flutter pub get --enforce-lockfile

      - name: dart format
        working-directory: sdk/mobile
        run: dart format --output=none --set-exit-if-changed lib test hook plugins/kim_media_picker/lib plugins/kim_media_picker/test

      - name: flutter analyze
        working-directory: sdk/mobile
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: plugin test
        working-directory: sdk/mobile/plugins/kim_media_picker
        run: |
          flutter pub get
          flutter analyze --fatal-infos --fatal-warnings
          flutter test

      - name: cargo fmt
        run: cargo fmt --manifest-path sdk/mobile/rust/Cargo.toml -- --check

      - name: flutter test
        working-directory: sdk/mobile
        run: flutter test

  sdk-media:
    name: media worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/media/package-lock.json

      - name: Install, typecheck, test
        working-directory: sdk/media
        run: |
          npm ci
          npm run typecheck
          npm test
