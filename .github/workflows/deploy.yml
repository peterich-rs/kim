name: Deploy

on:
  # Tag pushes run Image first; Image calls this workflow after the
  # GHCR tag exists. Do not also trigger here on tags — that races Image.
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to deploy (sha-…, 1.2.3, v1.2.3, or latest)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (sha-…, 1.2.3, v1.2.3, or latest)"
        required: false
        default: "latest"

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Pull image and compose up
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image tag
        id: img
        env:
          RAW: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          tag="${RAW}"
          if [[ -z "${tag}" ]]; then
            echo "error: image tag is empty" >&2
            exit 1
          fi
          # docker/metadata-action type=semver,pattern={{version}} stores
          # v0.1.0 as ghcr.io/<repo>:0.1.0. Strip one leading v from semver.
          if [[ "${tag}" =~ ^v[0-9] ]]; then
            tag="${tag#v}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "docker tag ${tag}"

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync openssh-client

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.KIM_VPS_HOST }}
          KEY: ${{ secrets.KIM_VPS_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.img.outputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/kim_deploy"
          chmod 600 "$HOME/.ssh/kim_deploy"
          host_name="${HOST##*@}"
          ssh-keyscan -t ed25519,ecdsa,rsa "$host_name" >> "$HOME/.ssh/known_hosts"
          ssh_cmd=(ssh -i "$HOME/.ssh/kim_deploy" -o IdentitiesOnly=yes -o BatchMode=yes)
          "${ssh_cmd[@]}" "$HOST" 'set -euo pipefail
            mkdir -p /opt/kim/deploy/consul
            chmod 755 /opt/kim /opt/kim/deploy /opt/kim/deploy/consul
            if [[ -d /opt/kim/deploy/consul/agent.hcl || -d /opt/kim/deploy/consul/acl-init.sh ]]; then
              docker rm -f kim-consul-1 kim-consul-acl-1 >/dev/null 2>&1 || true
            fi
            for name in agent.hcl acl-init.sh; do
              path="/opt/kim/deploy/consul/$name"
              if [[ -d "$path" ]]; then
                rmdir "$path" || {
                  echo "error: $path is a non-empty directory; refusing to replace it" >&2
                  exit 1
                }
                echo "removed invalid bind-mount directory $path"
              fi
            done'
          export RSYNC_RSH="${ssh_cmd[*]}"
          rsync -avz \
            deploy/compose.yml \
            deploy/Caddyfile \
            deploy/host.Caddyfile \
            deploy/chat.toml \
            deploy/gateway.toml \
            deploy/royal.toml \
            deploy/router.toml \
            deploy/prometheus.yml \
            deploy/prometheus \
            deploy/bootstrap.sh \
            deploy/remote-up.sh \
            deploy/psql-compose.sh \
            deploy/backfill-inbox.sh \
            deploy/backfill-inbox.sql \
            deploy/diff-inbox.sql \
            deploy/scan-empty-jti.sh \
            "$HOST:/opt/kim/deploy/"
          rsync -avz \
            deploy/consul/agent.hcl \
            deploy/consul/acl-init.sh \
            "$HOST:/opt/kim/deploy/consul/"
          "${ssh_cmd[@]}" "$HOST" 'set -euo pipefail
            cd /opt/kim/deploy
            chown -R root:root .
            chmod 755 bootstrap.sh remote-up.sh psql-compose.sh backfill-inbox.sh scan-empty-jti.sh consul/acl-init.sh
            chmod 644 consul/agent.hcl
            for f in compose.yml prometheus.yml prometheus/rules/kim.yml backfill-inbox.sql diff-inbox.sql scan-empty-jti.sh psql-compose.sh consul/agent.hcl consul/acl-init.sh; do
              test -f "$f" || { echo "error: missing regular file /opt/kim/deploy/$f" >&2; exit 1; }
            done
            bash bootstrap.sh'
          if [[ -z "$IMAGE" || "$IMAGE" == *: ]]; then
            echo "error: IMAGE is empty on the runner" >&2
            exit 1
          fi
          echo "deploying ${IMAGE}"
          # One remote argv so the login shell keeps quotes. Do not put GHCR_TOKEN
          # on the ssh command line (it would show up in ps). A YAML heredoc here
          # would un-indent and break the workflow file.
          printf '%s\n' "$GHCR_TOKEN" | "${ssh_cmd[@]}" "$HOST" \
            "IMAGE=$(printf %q "$IMAGE") GHCR_USER=$(printf %q "$GHCR_USER") bash -c 'read -r GHCR_TOKEN; export GHCR_TOKEN GHCR_USER IMAGE; exec bash /opt/kim/deploy/remote-up.sh'"
          rm -f "$HOME/.ssh/kim_deploy"
