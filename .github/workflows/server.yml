name: Server isolation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - "crates/shared/**"
      - "crates/server/**"
      - "services/**"
      - "examples/pkt-client/**"
      - "examples/kimbench/**"
      - "tools/build/**"
      - "tools/kim-server-migrate/**"
      - "deploy/*.toml"
      - ".github/workflows/server.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - "crates/shared/**"
      - "crates/server/**"
      - "services/**"
      - "examples/pkt-client/**"
      - "examples/kimbench/**"
      - "tools/build/**"
      - "tools/kim-server-migrate/**"
      - "deploy/*.toml"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-build:
    name: Build server without desktop manifests or Codex checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Install protobuf build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ make pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 2026-08-05
        with:
          toolchain: 1.95.0

      - name: Resolve and build isolated server graph
        run: python3 tools/build/check-server-context.py --build --target-dir "$RUNNER_TEMP/server-target"
