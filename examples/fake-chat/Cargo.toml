[package]
name = "fake-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
redis = ["kim-session/redis", "dep:redis"]
postgres = ["dep:sqlx"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
kim-container.workspace = true
kim-core.workspace = true
kim-naming.workspace = true
kim-protocol.workspace = true
kim-router.workspace = true
kim-session.workspace = true
kim-tcp.workspace = true
prost.workspace = true
redis = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
snowflake_me.workspace = true
sqlx = { workspace = true, optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
thiserror.workspace = true
toml = "0.8"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
fake-gateway = { path = "../fake-gateway" }
kim-router = { workspace = true, features = ["test-util"] }
kim-ws.workspace = true
pkt-client = { path = "../pkt-client" }

[lints]
workspace = true
