[self]
service_id = "wg-1"
service_name = "wgateway"
listen = "127.0.0.1:8001"
protocol = "ws"
# empty = DEMO_DEFAULT_SECRET (demo-only)
jwt_secret = ""
metrics_listen = "127.0.0.1:9001"
idc = "local"
domain = "ws://127.0.0.1:8001/"
royal_url = "http://127.0.0.1:8080"
token_ttl_secs = 86400

[[services]]
service_id = "chat-1"
service_name = "chat"
protocol = "tcp"
public_address = "127.0.0.1"
public_port = 8002
tags = ["zone:zone_local"]

[route]
route_by = "account"

[[route.zones]]
id = "zone_local"
weight = 100

[route.whitelist]
# account -> zone. Do not use JWT app keys such as "kim-gray".
# "alice" = "zone_gray"
