[self]
service_id = "tg-1"
service_name = "tgateway"
listen = "127.0.0.1:8003"
protocol = "tcp"
metrics_listen = "127.0.0.1:9003"
jwt_secret = ""
idc = "local"
domain = "127.0.0.1:8003"

[[services]]
service_id = "chat-1"
service_name = "chat"
protocol = "tcp"
public_address = "127.0.0.1"
public_port = 8002
tags = ["zone:zone_local"]

[route]
route_by = "account"

[[route.zones]]
id = "zone_local"
weight = 100

[route.whitelist]
# account -> zone. Do not use JWT app keys such as "kim-gray".
# "alice" = "zone_gray"
