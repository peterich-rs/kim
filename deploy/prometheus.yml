scrape_configs:
  - job_name: gateway
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:9001"]
  - job_name: chat
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:9002"]
  - job_name: tgateway
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:9003"]
  - job_name: router
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8088"]
