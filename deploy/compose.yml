# KIM production stack. App containers + Redis + Postgres + Consul.
# Host Caddy (or --profile edge) terminates TLS; this file does not bind :443
# unless the edge profile is on.
#
#   docker compose --env-file kim.env up -d
#   docker compose --env-file kim.env --profile edge up -d
#
# Redis, Postgres, and Consul stay on the compose network (Consul UI is
# loopback-only). Only the Web gateway (and lookup/token) are on loopback
# for a host reverse proxy.

name: kim

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kim}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  consul:
    image: hashicorp/consul:1.20
    restart: unless-stopped
    command:
      - agent
      - -server
      - -bootstrap-expect=1
      - -ui
      - -client=0.0.0.0
      - -dns-port=8600
    ports:
      - "127.0.0.1:8500:8500"
    volumes:
      - consul_data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  royal:
    image: ${KIM_IMAGE:?set KIM_IMAGE}
    restart: unless-stopped
    command: ["royal", "/etc/kim/royal.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      KIM_JWT_SECRET: ${KIM_JWT_SECRET:?set KIM_JWT_SECRET}
      CONSUL_HTTP_ADDR: http://consul:8500
      KIM_PUBLIC_ADDRESS: royal
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  chat:
    image: ${KIM_IMAGE:?set KIM_IMAGE}
    restart: unless-stopped
    command: ["chat", "/etc/kim/chat.toml"]
    depends_on:
      royal:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ROYAL_URL: http://royal:8080
      CONSUL_HTTP_ADDR: http://consul:8500
      KIM_PUBLIC_ADDRESS: chat
      KIM_SNOWFLAKE_NODE: "1"
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  chat-gray:
    image: ${KIM_IMAGE:?set KIM_IMAGE}
    restart: unless-stopped
    command: ["chat", "/etc/kim/chat.toml"]
    depends_on:
      royal:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ROYAL_URL: http://royal:8080
      CONSUL_HTTP_ADDR: http://consul:8500
      KIM_PUBLIC_ADDRESS: chat-gray
      KIM_SERVICE_ID: chat-2
      KIM_ZONE: zone_gray
      KIM_SNOWFLAKE_NODE: "2"
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  gateway:
    image: ${KIM_IMAGE:?set KIM_IMAGE}
    restart: unless-stopped
    command: ["gateway", "/etc/kim/gateway.toml"]
    depends_on:
      consul:
        condition: service_healthy
    environment:
      KIM_JWT_SECRET: ${KIM_JWT_SECRET:?set KIM_JWT_SECRET}
      CONSUL_HTTP_ADDR: http://consul:8500
      KIM_PUBLIC_ADDRESS: gateway
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  router:
    image: ${KIM_IMAGE:?set KIM_IMAGE}
    restart: unless-stopped
    command: ["router", "/etc/kim/router.toml"]
    depends_on:
      consul:
        condition: service_healthy
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      KIM_PUBLIC_ADDRESS: router
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.8-alpine
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      router:
        condition: service_healthy
      royal:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      KIM_DOMAIN: ${KIM_DOMAIN:-kim.ainexc.com}
      CADDY_EMAIL: ${CADDY_EMAIL:-ops@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["metrics"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  postgres_data:
  redis_data:
  consul_data:
  caddy_data:
  caddy_config:
