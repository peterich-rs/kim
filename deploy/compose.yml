# Local infra only. KIM processes stay `cargo run` on localhost.
# CI ignores this file.
#
#   docker compose -f deploy/compose.yml --profile metrics up
#   docker compose -f deploy/compose.yml --profile redis up
#   docker compose -f deploy/compose.yml --profile postgres up

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["metrics"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "127.0.0.1:6379:6379"

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_PASSWORD: kim
      POSTGRES_DB: kim
    ports:
      - "127.0.0.1:5432:5432"
