# KIM production stack. App containers + Redis + Postgres + Consul.
# Host Caddy (or --profile edge) terminates TLS; this file does not bind :443
# unless the edge profile is on.
#
#   docker compose --env-file kim.env up -d
#   docker compose --env-file kim.env --profile edge up -d
#
# Redis, Postgres, and Consul stay on the compose network (Consul HTTPS API is
# loopback-only on the host). Only the Web gateway (and lookup/login) are on
# loopback for a host reverse proxy.
#
# Production refuses to start without Redis password, Consul HTTPS/mTLS +
# gossip encrypt + per-service ACL token, and non-demo JWT/HMAC. Gossip key
# stays in consul/secrets.hcl (agent only). Roll new images Royal-before-Chat
# (or this whole stack in one window). Do not bring up ACL/TLS/password
# separately from the new binaries.

name: kim

x-kim-tls: &kim-tls
  - ./consul/tls/consul-agent-ca.pem:/etc/kim/consul-ca.pem:ro
  - ./consul/tls/consul-client.pem:/etc/kim/consul-client.pem:ro
  - ./consul/tls/consul-client-key.pem:/etc/kim/consul-client-key.pem:ro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kim}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  consul:
    image: hashicorp/consul:1.20
    restart: unless-stopped
    command: ["agent", "-config-dir=/consul/config", "-data-dir=/consul/data"]
    environment:
      CONSUL_HTTP_TOKEN: ${CONSUL_MANAGEMENT_TOKEN:?set CONSUL_MANAGEMENT_TOKEN}
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - consul_data:/consul/data
      - ./consul/agent.hcl:/consul/config/agent.hcl:ro
      - ./consul/secrets.hcl:/consul/config/secrets.hcl:ro
      - ./consul/tls:/consul/tls:ro
    healthcheck:
      test:
        [
          "CMD",
          "consul",
          "members",
          "-http-addr=https://127.0.0.1:8501",
          "-ca-file=/consul/tls/consul-agent-ca.pem",
          "-client-cert=/consul/tls/consul-client.pem",
          "-client-key=/consul/tls/consul-client-key.pem",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  consul-acl:
    image: hashicorp/consul:1.20
    restart: "no"
    depends_on:
      consul:
        condition: service_healthy
    environment:
      CONSUL_HTTP_ADDR: https://consul:8501
      CONSUL_HTTP_TOKEN: ${CONSUL_MANAGEMENT_TOKEN:?set CONSUL_MANAGEMENT_TOKEN}
      CONSUL_CACERT: /consul/tls/consul-agent-ca.pem
      CONSUL_CLIENT_CERT: /consul/tls/consul-client.pem
      CONSUL_CLIENT_KEY: /consul/tls/consul-client-key.pem
      CONSUL_TOKEN_CHAT: ${CONSUL_TOKEN_CHAT:?set CONSUL_TOKEN_CHAT}
      CONSUL_TOKEN_ROYAL: ${CONSUL_TOKEN_ROYAL:?set CONSUL_TOKEN_ROYAL}
      CONSUL_TOKEN_GATEWAY: ${CONSUL_TOKEN_GATEWAY:?set CONSUL_TOKEN_GATEWAY}
      CONSUL_TOKEN_ROUTER: ${CONSUL_TOKEN_ROUTER:?set CONSUL_TOKEN_ROUTER}
    volumes:
      - ./consul/tls:/consul/tls:ro
      - ./consul/acl-init.sh:/acl-init.sh:ro
    entrypoint: ["/bin/sh", "/acl-init.sh"]

  royal:
    image: ${KIM_IMAGE:?set KIM_IMAGE}
    restart: unless-stopped
    command: ["royal", "/etc/kim/royal.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul-acl:
        condition: service_completed_successfully
    environment:
      KIM_ENV: production
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      KIM_JWT_SECRET: ${KIM_JWT_SECRET:?set KIM_JWT_SECRET}
      KIM_INTERNAL_HMAC_SECRET: ${KIM_INTERNAL_HMAC_SECRET:?set KIM_INTERNAL_HMAC_SECRET}
      CHAT_URL: http://chat:9002
      CONSUL_HTTP_ADDR: https://consul:8501
      CONSUL_HTTP_TOKEN: ${CONSUL_TOKEN_ROYAL:?set CONSUL_TOKEN_ROYAL}
      CONSUL_CACERT: /etc/kim/consul-ca.pem
      CONSUL_CLIENT_CERT: /etc/kim/consul-client.pem
      CONSUL_CLIENT_KEY: /etc/kim/consul-client-key.pem
      KIM_PUBLIC_ADDRESS: royal
      KIM_APP: kim
      KIM_LOC_CACHE: "0"
      KIM_PENDING_RECEIPT: ${KIM_PENDING_RECEIPT_ROYAL:-0}
      KIM_INBOX_MATERIALIZED: ${KIM_INBOX_MATERIALIZED:-0}
      RUST_LOG: ${RUST_LOG:-info}
    volumes: *kim-tls
    expose:
      - "9003"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  royal-2:
    image: ${KIM_IMAGE:?set KIM_IMAGE}
    restart: unless-stopped
    command: ["royal", "/etc/kim/royal.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul-acl:
        condition: service_completed_successfully
    environment:
      KIM_ENV: production
      KIM_SERVICE_ID: royal-2
      KIM_SNOWFLAKE_NODE: "11"
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      KIM_JWT_SECRET: ${KIM_JWT_SECRET:?set KIM_JWT_SECRET}
      KIM_INTERNAL_HMAC_SECRET: ${KIM_INTERNAL_HMAC_SECRET:?set KIM_INTERNAL_HMAC_SECRET}
      CHAT_URL: http://chat:9002
      CONSUL_HTTP_ADDR: https://consul:8501
      CONSUL_HTTP_TOKEN: ${CONSUL_TOKEN_ROYAL:?set CONSUL_TOKEN_ROYAL}
      CONSUL_CACERT: /etc/kim/consul-ca.pem
      CONSUL_CLIENT_CERT: /etc/kim/consul-client.pem
      CONSUL_CLIENT_KEY: /etc/kim/consul-client-key.pem
      KIM_PUBLIC_ADDRESS: royal-2
      KIM_APP: kim
      KIM_LOC_CACHE: "0"
      KIM_PENDING_RECEIPT: ${KIM_PENDING_RECEIPT_ROYAL:-0}
      KIM_INBOX_MATERIALIZED: ${KIM_INBOX_MATERIALIZED:-0}
      RUST_LOG: ${RUST_LOG:-info}
    volumes: *kim-tls
    expose:
      - "9003"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  chat:
    image: ${KIM_IMAGE:?set KIM_IMAGE}
    restart: unless-stopped
    command: ["chat", "/etc/kim/chat.toml"]
    depends_on:
      royal:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul-acl:
        condition: service_completed_successfully
    environment:
      KIM_ENV: production
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      ROYAL_URL: http://royal:8080
      KIM_INTERNAL_HMAC_SECRET: ${KIM_INTERNAL_HMAC_SECRET:?set KIM_INTERNAL_HMAC_SECRET}
      CONSUL_HTTP_ADDR: https://consul:8501
      CONSUL_HTTP_TOKEN: ${CONSUL_TOKEN_CHAT:?set CONSUL_TOKEN_CHAT}
      CONSUL_CACERT: /etc/kim/consul-ca.pem
      CONSUL_CLIENT_CERT: /etc/kim/consul-client.pem
      CONSUL_CLIENT_KEY: /etc/kim/consul-client-key.pem
      KIM_PUBLIC_ADDRESS: chat
      KIM_SNOWFLAKE_NODE: "1"
      KIM_LOC_CACHE: "0"
      KIM_PENDING_RECEIPT: ${KIM_PENDING_RECEIPT_CHAT:-0}
      RUST_LOG: ${RUST_LOG:-info}
    volumes: *kim-tls
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  chat-gray:
    image: ${KIM_IMAGE:?set KIM_IMAGE}
    restart: unless-stopped
    command: ["chat", "/etc/kim/chat.toml"]
    depends_on:
      royal:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul-acl:
        condition: service_completed_successfully
    environment:
      KIM_ENV: production
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      ROYAL_URL: http://royal:8080
      KIM_INTERNAL_HMAC_SECRET: ${KIM_INTERNAL_HMAC_SECRET:?set KIM_INTERNAL_HMAC_SECRET}
      CONSUL_HTTP_ADDR: https://consul:8501
      CONSUL_HTTP_TOKEN: ${CONSUL_TOKEN_CHAT:?set CONSUL_TOKEN_CHAT}
      CONSUL_CACERT: /etc/kim/consul-ca.pem
      CONSUL_CLIENT_CERT: /etc/kim/consul-client.pem
      CONSUL_CLIENT_KEY: /etc/kim/consul-client-key.pem
      KIM_PUBLIC_ADDRESS: chat-gray
      KIM_SERVICE_ID: chat-2
      KIM_ZONE: zone_gray
      KIM_SNOWFLAKE_NODE: "2"
      KIM_LOC_CACHE: "0"
      KIM_PENDING_RECEIPT: ${KIM_PENDING_RECEIPT_CHAT:-0}
      RUST_LOG: ${RUST_LOG:-info}
    volumes: *kim-tls
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  gateway:
    image: ${KIM_IMAGE:?set KIM_IMAGE}
    restart: unless-stopped
    command: ["gateway", "/etc/kim/gateway.toml"]
    depends_on:
      consul-acl:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # Chat registers as `chat:8002`. Starting the gateway before that
      # hostname exists makes the first dial fail; Consul can stay
      # passing across a short recreate and never push a new snapshot.
      chat:
        condition: service_healthy
    environment:
      KIM_ENV: production
      KIM_JWT_SECRET: ${KIM_JWT_SECRET:?set KIM_JWT_SECRET}
      KIM_INTERNAL_HMAC_SECRET: ${KIM_INTERNAL_HMAC_SECRET:?set KIM_INTERNAL_HMAC_SECRET}
      CONSUL_HTTP_ADDR: https://consul:8501
      CONSUL_HTTP_TOKEN: ${CONSUL_TOKEN_GATEWAY:?set CONSUL_TOKEN_GATEWAY}
      CONSUL_CACERT: /etc/kim/consul-ca.pem
      CONSUL_CLIENT_CERT: /etc/kim/consul-client.pem
      CONSUL_CLIENT_KEY: /etc/kim/consul-client-key.pem
      KIM_PUBLIC_ADDRESS: gateway
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      KIM_LOC_CACHE: "0"
      KIM_REQUIRE_JTI: ${KIM_REQUIRE_JTI:-0}
      RUST_LOG: ${RUST_LOG:-info}
    volumes: *kim-tls
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  router:
    image: ${KIM_IMAGE:?set KIM_IMAGE}
    restart: unless-stopped
    command: ["router", "/etc/kim/router.toml"]
    depends_on:
      consul-acl:
        condition: service_completed_successfully
    environment:
      KIM_ENV: production
      CONSUL_HTTP_ADDR: https://consul:8501
      CONSUL_HTTP_TOKEN: ${CONSUL_TOKEN_ROUTER:?set CONSUL_TOKEN_ROUTER}
      CONSUL_CACERT: /etc/kim/consul-ca.pem
      CONSUL_CLIENT_CERT: /etc/kim/consul-client.pem
      CONSUL_CLIENT_KEY: /etc/kim/consul-client-key.pem
      KIM_PUBLIC_ADDRESS: router
      KIM_JWT_SECRET: ${KIM_JWT_SECRET:?set KIM_JWT_SECRET}
      RUST_LOG: ${RUST_LOG:-info}
    volumes: *kim-tls
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.8-alpine
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      router:
        condition: service_healthy
      royal:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      KIM_DOMAIN: ${KIM_DOMAIN:-kim.ainexc.com}
      CADDY_EMAIL: ${CADDY_EMAIL:-ops@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../sdk/web/dist-app:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["metrics"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro

volumes:
  postgres_data:
  redis_data:
  consul_data:
  caddy_data:
  caddy_config:
